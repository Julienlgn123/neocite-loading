<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>NeoCite RP</title>
<!-- Compatible Chromium 86 (navigateur intégré de Garry's Mod) : pas de inset, gap flexbox ni aspect-ratio -->
<style>
@font-face { font-family: "Barlow Condensed"; src: url(fonts/BarlowCondensed-SemiBold.ttf); font-weight: 600; }
@font-face { font-family: "Barlow Condensed"; src: url(fonts/BarlowCondensed-Bold.ttf); font-weight: 700; }
@font-face { font-family: "Barlow"; src: url(fonts/Barlow-Medium.ttf); font-weight: 500; }
@font-face { font-family: "Barlow"; src: url(fonts/Barlow-SemiBold.ttf); font-weight: 600; }

:root {
  --bg: #0F1013;
  --surface: #17191E;
  --line: #2A2D35;
  --text: #ECEBE8;
  --muted: #8C9099;
  --accent: #F2C14E;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font-family: "Barlow", sans-serif; font-weight: 500; -webkit-user-select: none; user-select: none; }

/* Plan de ville qui dérive lentement */
.map { position: absolute; top: -8vh; left: -6vw; width: 112vw; height: 116vh;
  background: url(map.svg) center / cover no-repeat; opacity: .9;
  animation: drift 70s ease-in-out infinite alternate; }
@keyframes drift { from { transform: translate3d(0, 0, 0) scale(1.02); } to { transform: translate3d(-4vw, -3vh, 0) scale(1.06); } }
.shade { position: absolute; top: 0; right: 0; bottom: 0; left: 0;
  background: linear-gradient(90deg, rgba(15,16,19,.97) 0%, rgba(15,16,19,.9) 42%, rgba(15,16,19,.45) 75%, rgba(15,16,19,.3) 100%),
              linear-gradient(0deg, rgba(15,16,19,.95) 0%, rgba(15,16,19,0) 40%); }

.page { position: absolute; top: 0; right: 0; bottom: 0; left: 0; padding: 7vh 6vw 0 6vw; }

/* En-tête */
.top { display: flex; justify-content: space-between; align-items: flex-start; }
.lockup { display: flex; align-items: center; }
.lockup img { width: 6.2vh; height: 6.2vh; margin-right: 1.8vh; }
.lockup .wm { font-family: "Barlow Condensed"; font-weight: 700; font-size: 5.4vh; line-height: .9; letter-spacing: .1vh; }
.lockup .rp { display: block; font-family: "Barlow Condensed"; font-weight: 600; font-size: 1.5vh; letter-spacing: .7vh; color: var(--accent); margin-top: .6vh; }

.meta { display: flex; }
.meta div { margin-left: 4.5vh; text-align: right; }
.meta dt { font-size: 1.4vh; color: var(--muted); text-transform: uppercase; letter-spacing: .25vh; }
.meta dd { font-family: "Barlow Condensed"; font-weight: 600; font-size: 2.6vh; margin-top: .4vh; }

/* Bloc principal */
.hero { position: absolute; left: 6vw; top: 30vh; width: 48vw; }
.hero h1 { font-family: "Barlow Condensed"; font-weight: 700; font-size: 10.5vh; line-height: .95; letter-spacing: .1vh; }
.hero h1 span { color: var(--accent); }
.hero p { margin-top: 2.4vh; font-size: 2.3vh; line-height: 1.45; color: var(--muted); max-width: 40vw; }

/* Astuce */
.tip { position: absolute; right: 6vw; top: 34vh; width: 30vw; max-width: 64vh;
  background: rgba(23,25,30,.88); border: 1px solid var(--line); border-radius: 3px; padding: 2.8vh 3vh; }
.tip h2 { font-family: "Barlow Condensed"; font-weight: 600; font-size: 1.7vh; letter-spacing: .4vh; color: var(--accent); }
.tip p { margin-top: 1.4vh; font-size: 2.3vh; line-height: 1.4; min-height: 6.4vh; transition: opacity .4s ease; }
.tip p.out { opacity: 0; }
.tip b { color: var(--text); font-weight: 600; background: rgba(242,193,78,.14); padding: 0 .5vh; border-radius: 2px; }
.tip .rule { margin-top: 2.2vh; padding-top: 1.8vh; border-top: 1px solid var(--line); font-size: 1.8vh; color: var(--muted); line-height: 1.5; }

/* Progression : reste au-dessus de la boîte de chargement de GMod (bas droite) */
.load { position: absolute; left: 6vw; right: 6vw; bottom: 12vh; }
.load .row { display: flex; justify-content: space-between; align-items: flex-end; }
.status { font-size: 2.4vh; font-weight: 600; }
.status small { display: block; margin-top: .6vh; font-size: 1.7vh; font-weight: 500; color: var(--muted);
  max-width: 60vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 2.2vh; }
.pct { font-family: "Barlow Condensed"; font-weight: 700; font-size: 7vh; line-height: .85; font-variant-numeric: tabular-nums; }
.pct span { font-size: 3vh; color: var(--muted); margin-left: .4vh; }
.track { position: relative; height: .45vh; margin-top: 2vh; background: var(--line); border-radius: 1px; overflow: hidden; }
.fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--accent); }
.foot { display: flex; justify-content: space-between; margin-top: 1.4vh; font-size: 1.6vh; color: var(--muted); }

@media (prefers-reduced-motion: reduce) { .map { animation: none; } }
</style>
</head>
<body>
<div class="map"></div>
<div class="shade"></div>

<div class="page">
  <div class="top">
    <div class="lockup">
      <img src="logo.svg" alt="">
      <div><div class="wm">NEOCITE</div><span class="rp">ROLEPLAY</span></div>
    </div>
    <dl class="meta">
      <div><dt>Map</dt><dd id="map">rp_downtown</dd></div>
      <div><dt>Places</dt><dd id="max">32</dd></div>
      <div><dt>Mode</dt><dd id="mode">DarkRP</dd></div>
    </dl>
  </div>

  <div class="hero">
    <h1 id="title">Bienvenue en ville<span>.</span></h1>
    <p>Choisis ton métier avec F4, trouve un logement avec F2 et lis les règles avec F1 avant de te lancer.</p>
  </div>

  <div class="tip">
    <h2>ASTUCE</h2>
    <p id="tip"></p>
    <div class="rule" id="rule"></div>
  </div>

  <div class="load">
    <div class="row">
      <div class="status"><span id="status">Connexion au serveur</span><small id="file"></small></div>
      <div class="pct" id="pct">0<span>%</span></div>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="foot"><span id="files">&nbsp;</span><span>Serveur DarkRP francophone</span></div>
  </div>
</div>

<script>
(function () {
  var TIPS = [
    "Appuie sur <b>F4</b> pour changer de métier ou acheter du matériel.",
    "Regarde une porte et appuie sur <b>F2</b> pour l'acheter.",
    "Tape <b>/advert</b> suivi d'un message pour faire une annonce publique.",
    "Le Maire vote les lois. Elles s'appliquent à tout le monde.",
    "Ton salaire tombe automatiquement toutes les quelques minutes.",
    "Tape <b>/give</b> et un montant pour payer le joueur que tu regardes.",
    "Appuie sur <b>TAB</b> pour voir qui est en ligne et qui est en service."
  ];
  var RULES = [
    "Règle : pas de meurtre sans raison RP (RDM).",
    "Règle : après ta mort, tu oublies la scène (NLR, 3 minutes).",
    "Règle : ce que tu sais hors du jeu reste hors du jeu (No Meta)."
  ];

  // Statuts envoyés par GMod -> [texte, progression minimale]
  var STAGES = [
    [/retrieving server info/i, "Récupération des informations", 4],
    [/sending client info/i, "Envoi de tes informations", 8],
    [/workshop initialized/i, "Préparation du Workshop", 12],
    [/mounting addons/i, "Montage des addons", 16],
    [/workshop complete/i, "Workshop prêt", 60],
    [/precaching/i, "Chargement des modèles", 65],
    [/starting lua/i, "Démarrage des scripts", 72],
    [/received all lua files/i, "Scripts reçus", 85],
    [/lua.*(loaded|ready)|client info sent/i, "Arrivée en ville", 92],
    [/loading/i, "Chargement des ressources", 40]
  ];

  var $ = function (id) { return document.getElementById(id); };
  var total = 0, needed = 0, target = 2, shown = 0, gotEvent = false;

  window.GameDetails = function (servername, serverurl, mapname, maxplayers, steamid, gamemode) {
    gotEvent = true;
    if (mapname) $("map").textContent = mapname;
    if (maxplayers) $("max").textContent = maxplayers;
    if (gamemode) $("mode").textContent = gamemode === "darkrp" ? "DarkRP" : gamemode;
  };
  window.SetFilesTotal = function (n) { gotEvent = true; total = n; updateFiles(); };
  window.SetFilesNeeded = function (n) { gotEvent = true; needed = n; updateFiles(); };
  window.DownloadingFile = function (name) {
    gotEvent = true;
    $("file").textContent = String(name).replace(/^.*[\\\/]/, "");
    if (!total) raise(target + 1);
  };
  window.SetStatusChanged = function (s) {
    gotEvent = true;
    s = String(s || "");
    for (var i = 0; i < STAGES.length; i++) {
      if (STAGES[i][0].test(s)) { $("status").textContent = STAGES[i][1]; raise(STAGES[i][2]); return; }
    }
    $("status").textContent = s;
    raise(target + 1);
  };

  function updateFiles() {
    if (total <= 0) return;
    var done = Math.max(0, total - needed);
    $("files").textContent = done + " / " + total + " fichiers";
    raise(20 + 40 * done / total);
  }
  function raise(p) { if (p > target) target = Math.min(p, 99); }

  setInterval(function () {
    if (shown < target) shown += Math.max(0.15, (target - shown) * 0.12);
    else if (shown < 97) shown += 0.02;
    if (shown > 99) shown = 99;
    $("fill").style.width = shown.toFixed(2) + "%";
    $("pct").innerHTML = Math.floor(shown) + "<span>%</span>";
  }, 50);

  // Astuces et rappels de règles
  var ti = Math.floor(Math.random() * TIPS.length), ri = 0;
  function rotate() {
    var el = $("tip");
    el.className = "out";
    setTimeout(function () {
      el.innerHTML = TIPS[ti];
      $("rule").textContent = RULES[ri];
      el.className = "";
      ti = (ti + 1) % TIPS.length;
      ri = (ri + 1) % RULES.length;
    }, 400);
  }
  rotate(); setInterval(rotate, 7000);

  // Paramètres d'URL et mode démo (?demo) hors du jeu
  var q = {};
  location.search.replace(/[?&]([^=&]+)=?([^&]*)/g, function (_, k, v) { q[k] = decodeURIComponent(v); });
  if (q.map && q.map.indexOf("%") < 0) $("map").textContent = q.map;

  if (q.demo !== undefined) setTimeout(function () {
    if (gotEvent) return;
    GameDetails("NeoCite RP", "", q.map || "rp_downtown_tits_v2", 32, "", "darkrp");
    var steps = ["Retrieving server info", "Sending client info", "Mounting Addons", "Workshop Complete", "Starting Lua...", "Received all Lua files we needed!", "Client info sent!"];
    var files = ["materials/neocite/logo.png", "resource/fonts/BarlowCondensed-Bold.ttf", "resource/fonts/Barlow-SemiBold.ttf", "materials/neocite/banner.png"];
    var t = 0;
    steps.forEach(function (st, i) {
      setTimeout(function () { SetStatusChanged(st); }, (t += 1800));
      if (i === 2) {
        SetFilesTotal(files.length); SetFilesNeeded(files.length);
        files.forEach(function (f, j) {
          setTimeout(function () { DownloadingFile(f); SetFilesNeeded(files.length - j - 1); }, (t += 900));
        });
      }
    });
  }, 800);
})();
</script>
</body>
</html>
